<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>守護霊召喚</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#msg{position:fixed;left:0;right:0;bottom:8%;text-align:center;color:#9fd4ff;font-size:3.2vmin;letter-spacing:.3em;text-shadow:0 0 12px #4af;transition:opacity 1s;pointer-events:none}
#dbg{position:fixed;left:8px;top:8px;color:#6cf;font:12px monospace;display:none}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#9fd4ff;z-index:9;gap:2vmin}
#start button{font-size:3vmin;padding:1vmin 4vmin;background:#123;color:#9fd4ff;border:1px solid #4af;cursor:pointer;font-family:inherit}
video{display:none}
</style></head><body>
<canvas id="c"></canvas><video id="v" playsinline muted></video>
<div id="msg">杖を振れ …「エクスペクト・パトローナム」</div>
<div id="dbg"></div>
<div id="start"><div style="font-size:5vmin">守護霊召喚</div>
<button id="go">開始(カメラを許可してください)</button>
<div style="font-size:1.8vmin;opacity:.7;text-align:center;line-height:1.8">Space=手動召喚 / 1〜5=動物指定 / ↑↓=感度 / D=デバッグ / F=全画面</div></div>
<script src="config.js"></script>
<script src="audio.js"></script>
<script src="effect.js"></script>
<script src="detector.js"></script>
<script src="main.js"></script>
</body></html>
