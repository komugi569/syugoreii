<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>守護霊 3D試作</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:sans-serif}
canvas{display:block}
#hint{position:fixed;left:10px;top:10px;color:#6cf;font:13px/1.7 monospace;white-space:pre;opacity:.8}
</style>
<script type="importmap">
{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}
</script></head><body>
<div id="hint">Space=ランダム召喚 / 1〜5=動物指定 / R=向きを90°回す / M=質感切替 / H=表示切替 / F=全画面</div>

<!-- 背景用映像ファイル -->
<video id="bg-video" src="./ディメンター.mp4" autoplay muted playsinline style="display:none;"></video>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {PATRONUS_MODELS} from './patronus-config.js';

const AudioController = {
  sounds: {},
  files: { bgm: '守護霊召喚.mp3' },
  init() {
    if (Object.keys(this.sounds).length === 0) {
      for (const [key, path] of Object.entries(this.files)) {
        this.sounds[key] = new Audio(path);
        this.sounds[key].load();
      }
    }
  },
  playLoop(type) {
    const sound = this.sounds[type];
    if (!sound) return;
    if (!sound.paused) return;
    sound.loop = true;
    sound.currentTime = 0;
    sound.play().catch(error => {
      console.warn(`ループ音声(${type})の再生がブロックされました:`, error);
    });
  },
  stop(type) {
    const sound = this.sounds[type];
    if (!sound) return;
    sound.pause();
    sound.currentTime = 0;
  }
};

// ===== 設定 =====
const T={form:2.2,pose:1,away:5,turn:1,back:5,stay:1.5,fade:1.5}; // 秒
const NEAR=new THREE.Vector3(0, -0.2, 4.0), FAR=new THREE.Vector3(2.5,0,-16);
const hint=document.getElementById('hint');

// ===== 基本セットアップ =====
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.3,6);camera.lookAt(0,1,0);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
// 光のあふれ出し（ブルーム）を少し強調
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.8, 0.7, 0.8));
composer.addPass(new OutputPass());

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
});

// ===== 背景映像と環境光の設定 =====
const video = document.getElementById('bg-video');
const TRIM_START = 2.0; 
video.addEventListener('loadedmetadata', () => { video.currentTime = TRIM_START; });
video.addEventListener('ended', () => {
  video.currentTime = TRIM_START;
  video.play().catch(e => console.warn('ループ再生エラー:', e));
});

const videoTexture = new THREE.VideoTexture(video);
videoTexture.colorSpace = THREE.SRGBColorSpace;
scene.background = videoTexture;
scene.fog = new THREE.FogExp2(0x000010, 0.035);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.02);
scene.add(ambientLight);

// ===== 光る質感 =====
const glowMat=new THREE.ShaderMaterial({
  uniforms:{uColor:{value:new THREE.Color(0x9fd4ff)},uOp:{value:0}},
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
  vertexShader:`#include <common>
  #include <morphtarget_pars_vertex>
  varying vec3 vN;varying vec3 vV;
  void main(){
    #include <beginnormal_vertex>
    #include <morphnormal_vertex>
    #include <begin_vertex>
    #include <morphtarget_vertex>
    vN=normalize(normalMatrix*objectNormal);
    vec4 mv=modelViewMatrix*vec4(transformed,1.);vV=normalize(-mv.xyz);
    gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform vec3 uColor;uniform float uOp;varying vec3 vN;varying vec3 vV;
  void main(){float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),2.2);
    gl_FragColor=vec4(uColor*(.5+f*1.8),(f*.95+.07)*uOp);}`});
const simpleMat=new THREE.MeshBasicMaterial({color:0x9fd4ff,transparent:true,opacity:0,
  blending:THREE.AdditiveBlending,depthWrite:false});
let useGlow=true;const meshes=[];
const setOpacity=o=>{glowMat.uniforms.uOp.value=o;simpleMat.opacity=o*.5};

// ===== 守護霊カタログ =====
const catalog=PATRONUS_MODELS;
const actor=new THREE.Group(),inner=new THREE.Group();actor.add(inner);scene.add(actor);actor.visible=false;
let yaw=0,mixer=null;inner.rotation.y=yaw;
const loaded=new Map();
function prepareModel(gltf,entry){
  const m=gltf.scene;
  m.traverse(o=>{if(o.isMesh){o.material=glowMat;o.frustumCulled=false;meshes.push(o)}});
  const b=new THREE.Box3().setFromObject(m),s=b.getSize(new THREE.Vector3());
  m.scale.setScalar(entry.scale/Math.max(s.x,s.y,s.z));
  const b2=new THREE.Box3().setFromObject(m),c=b2.getCenter(new THREE.Vector3());
  // x, y, z 全てのオフセット（微調整）を適用できるように変更
  m.position.set(
    -c.x + (entry.xOffset || 0),
    -b2.min.y + (entry.yOffset || 0),
    -c.z + (entry.zOffset || 0)
  );
  
  return m;
}

for(const [i,entry] of catalog.entries()){
  if(entry.url) {
    new GLTFLoader().load(entry.url,g=>{
      loaded.set(i,{model:prepareModel(g,entry),animations:g.animations,entry});
      hint.textContent+=`\n${entry.name}を読み込みました`;
    },undefined,()=>{hint.textContent+=`\n${entry.name}のGLBを読み込めません`;});
  }
}

function selectSpirit(index){
  const data=loaded.get(index);if(!data)return false;
  while(inner.children.length)inner.remove(inner.children[0]);
  for(const m of meshes.slice())if(!m.parent)meshes.splice(meshes.indexOf(m),1);
  inner.add(data.model);
  data.model.traverse?.(o=>{if(o.isMesh)o.material=useGlow?glowMat:simpleMat;});
  
  yaw = (data.entry.yawOffset||0) + Math.PI;
  inner.rotation.set(0, yaw, 0);
  inner.position.set(0, 0, 0);
  
  mixer = data.animations.length ? new THREE.AnimationMixer(data.model) : null;
  if(mixer){const n=data.entry.runAnimIndex??0;mixer.clipAction(data.animations[Math.min(n,data.animations.length-1)]).play();}
  return true;
}

// ===== まばゆい光の中心（フラッシュ）用スプライト =====
const fc = document.createElement('canvas'); fc.width = fc.height = 256;
const fx = fc.getContext('2d');
const fg = fx.createRadialGradient(128,128,0, 128,128,128);
fg.addColorStop(0, 'rgba(255,255,255,1)');
fg.addColorStop(0.1, 'rgba(200,240,255,1)');
fg.addColorStop(1, 'rgba(0,0,0,0)');
fx.fillStyle = fg; fx.fillRect(0,0,256,256);
const flashSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: new THREE.CanvasTexture(fc),
  color: 0xffffff,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false
}));
flashSprite.visible = false;
scene.add(flashSprite);

// ===== 足元の光 =====
const gc=document.createElement('canvas');gc.width=gc.height=128;
const gx=gc.getContext('2d'),gg=gx.createRadialGradient(64,64,0,64,64,64);
gg.addColorStop(0,'rgba(140,200,255,.9)');gg.addColorStop(1,'rgba(0,0,0,0)');gx.fillStyle=gg;gx.fillRect(0,0,128,128);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(4,4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(gc),
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0}));
floor.rotation.x=-Math.PI/2;floor.position.y=.02;scene.add(floor);


// ===== 演出の進行 =====
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const hAway=Math.atan2(FAR.x-NEAR.x,FAR.z-NEAR.z);
let t0=null,playing=false;

function summon(index){
  if (video.paused) { video.play().catch(e => console.warn('動画再生ブロック:', e)); }
  AudioController.init();
  AudioController.playLoop('bgm');

  if(playing)return;
  const available=[...loaded.keys()];
  const chosen=index??available[Math.floor(Math.random()*available.length)];
  if(!selectSpirit(chosen))return;
  playing=true;t0=performance.now()/1000;actor.visible=true;hint.dataset.active=catalog[chosen].name;
}

let lastTime = performance.now();
function frame(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, .05);
  lastTime = now;
  requestAnimationFrame(frame);
  
  if(playing){
    const t=now/1000-t0;
    
    let pos=NEAR.clone(), h=hAway, scl=1;
    if(t<T.form) scl=.7+.3*ease(t/T.form);
    
    const stayDuration = 8.0; 
    const tEnd = T.form + stayDuration;
    const tFade = tEnd + T.fade;

    // 守護霊の透明度
    const op = Math.min(1, t/T.form) * (t > tEnd ? Math.max(0, 1 - (t - tEnd)/T.fade) : 1);
    
    actor.position.copy(pos);
    actor.rotation.y = h;
    actor.scale.setScalar(scl);
    setOpacity(op);

    // まばゆいフラッシュの演出
    if(t < T.form) {
      const u = t / T.form;
      // 最初の0.2割りの時間で最大まで光り、残りの時間でゆっくり光が収まる
      const flashOp = u < 0.2 ? u / 0.2 : 1 - (u - 0.2)/0.8;
      
      flashSprite.position.copy(pos);
      flashSprite.position.y += 0.8; // モデルの少し上（中心付近）
      flashSprite.scale.setScalar(4.0 + Math.sin(u * Math.PI) * 2.0); // 光の広がり
      flashSprite.material.opacity = flashOp * 1.5; // 強烈に光らせる
      flashSprite.visible = true;
    } else {
      flashSprite.visible = false;
    }
    
    if(mixer) {
      mixer.update(dt * 0.2);
    } else {
      inner.position.y = Math.sin(now / 800) * 0.15; 
      inner.rotation.z = Math.sin(now / 1000) * 0.05; 
    }
    
    floor.position.set(pos.x, .02, pos.z);
    floor.material.opacity = op * .55;
    floor.scale.setScalar(scl);
    
    if(t > tFade){ playing=false; actor.visible=false; floor.material.opacity=0; }
  }
  
  composer.render();
}
frame();

addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();summon()}
  else if(/^[1-5]$/.test(e.key))summon(Number(e.key)-1)
  else if(e.key==='r'||e.key==='R'){yaw+=Math.PI/2;inner.rotation.y=yaw}
  else if(e.key==='m'||e.key==='M'){useGlow=!useGlow;meshes.forEach(o=>o.material=useGlow?glowMat:simpleMat)}
  else if(e.key==='h'||e.key==='H')hint.style.display=hint.style.display==='none'?'block':'none';
  else if(e.key==='f'||e.key==='F')document.documentElement.requestFullscreen?.();
});
addEventListener('pointerdown',summon);
</script></body></html>
